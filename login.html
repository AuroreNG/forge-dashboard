<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FORGE | Sign In</title>

  <link
    rel="stylesheet"
    href="./login.css"
  />
</head>


<body>

  <!-- =====================================================
       FORGE LOGIN PAGE
  ====================================================== -->

  <main class="forge-login-page">


    <!-- DECORATIVE BACKGROUND -->

    <div class="login-orb orb-one"></div>
    <div class="login-orb orb-two"></div>
    <div class="login-orb orb-three"></div>


    <!-- =================================================
         LOGIN SHELL
    ================================================== -->

    <section class="forge-login-shell">


      <!-- ===============================================
           FORGE BRAND
      ================================================ -->

      <div class="forge-login-brand">

        <img
          src="./forge-logo.png"
          alt="FORGE"
          class="forge-login-logo"
        />

      </div>


      <!-- ===============================================
           LOGIN CARD
      ================================================ -->

      <div class="forge-login-card">


        <!-- BADGE -->

        <div class="login-badge">
          SECURE ACCESS
        </div>


        <!-- TITLE -->

        <h1 id="loginTitle">
          Welcome to FORGE
        </h1>

        <p
          class="login-description"
          id="loginDescription"
        >
          Secure access to your licensing workspace.
          Enter your email to receive a one-time
          verification code.
        </p>


        <!-- ===========================================
             STEP 1 — EMAIL
        ============================================ -->

        <div id="emailStep">

          <label for="loginEmail">
            Email address
          </label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="name@email.com"
          />


          <button
            id="sendLoginCode"
            class="forge-login-primary"
            type="button"
          >

            <span>
              Continue
            </span>

            <span aria-hidden="true">
              →
            </span>

          </button>

        </div>


        <!-- ===========================================
             STEP 2 — OTP
        ============================================ -->

        <div
          id="otpStep"
          class="hidden"
        >


          <!-- EMAIL BEING VERIFIED -->

          <div class="otp-email-row">

            <span id="otpEmailDisplay">
            </span>

            <button
              id="changeLoginEmail"
              type="button"
            >
              Change
            </button>

          </div>


          <!-- OTP FIELD -->

          <label for="loginOtp">
            Verification code
          </label>

          <input
            id="loginOtp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="Enter 6-digit code"
          />


          <!-- VERIFY -->

          <button
            id="verifyLoginCode"
            class="forge-login-primary"
            type="button"
          >

            <span>
              Sign in
            </span>

            <span aria-hidden="true">
              →
            </span>

          </button>


          <!-- RESEND -->

          <button
            id="resendLoginCode"
            class="resend-code-btn"
            type="button"
          >
            Resend verification code
          </button>


        </div>


        <!-- ===========================================
             SUCCESS / ERROR MESSAGE
        ============================================ -->

        <div
          id="loginMessage"
          class="login-message"
          aria-live="polite"
        >
        </div>


      </div>
      <!-- END LOGIN CARD -->


      <!-- ===============================================
           SECURITY FOOTER
      ================================================ -->

      <div class="login-footer">

        <div class="login-security">

          <span class="security-dot"></span>

          <span>
            Secure FORGE access
          </span>

        </div>

        <p>
          Authorized users only
        </p>

      </div>


    </section>
    <!-- END LOGIN SHELL -->


  </main>
  <!-- END LOGIN PAGE -->


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./supabase-config.js?v=2"></script>


  <!-- =====================================================
       FORGE LOGIN LOGIC
  ====================================================== -->

  <script src="./login.js?v=1"></script>


</body>

</html>
