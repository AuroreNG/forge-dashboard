<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FORGE | Sign In</title>

  <link
    rel="stylesheet"
    href="login.css"
  />
</head>

<body>

  <main class="forge-login-page">

    <div class="login-orb orb-one"></div>
    <div class="login-orb orb-two"></div>
    <div class="login-orb orb-three"></div>


    <section class="forge-login-shell">

      <!-- FORGE BRAND -->

      <div class="forge-login-brand">

        <!-- USE YOUR ACTUAL FORGE LOGO HERE -->
        <img
          src="./forge-logo.png"
          alt="FORGE"
          class="forge-login-logo"
        />

      </div>


      <!-- LOGIN CARD -->

      <div class="forge-login-card">

        <div class="login-badge">
          SECURE ACCESS
        </div>

        <h1 id="loginTitle">
          Welcome to FORGE
        </h1>

        <p
          class="login-description"
          id="loginDescription"
        >
          Enter your email to receive a secure
          one-time verification code.
        </p>


        <!-- EMAIL STEP -->

        <div id="emailStep">

          <label for="loginEmail">
            Email address
          </label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="name@email.com"
          />

          <button
            id="sendLoginCode"
            class="forge-login-primary"
          >
            Send verification code
            <span>→</span>
          </button>

        </div>


        <!-- OTP STEP -->

        <div
          id="otpStep"
          class="hidden"
        >

          <div class="otp-email-row">

            <span id="otpEmailDisplay"></span>

            <button
              id="changeLoginEmail"
              type="button"
            >
              Change
            </button>

          </div>

          <label for="loginOtp">
            Verification code
          </label>

          <input
            id="loginOtp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="Enter 6-digit code"
          />

          <button
            id="verifyLoginCode"
            class="forge-login-primary"
          >
            Sign in
            <span>→</span>
          </button>

          <button
            id="resendLoginCode"
            class="resend-code-btn"
            type="button"
          >
            Resend code
          </button>

        </div>


        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </div>


      <p class="login-security-note">
        Secure access to your FORGE organization
      </p>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./supabase-config.js?v=2"></script>
  <script src="./login.js"></script>

</body>

</html>
