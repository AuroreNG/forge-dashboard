<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Set Up Your FORGE Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #071c43;
      background:
        radial-gradient(
          circle at top left,
          rgba(54, 101, 255, 0.18),
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(122, 53, 255, 0.16),
          transparent 40%
        ),
        #f4f8ff;
    }

    .setup-card {
      width: min(100%, 480px);
      padding: 42px;
      border: 1px solid rgba(22, 62, 130, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow:
        0 30px 70px rgba(16, 50, 105, 0.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: white;
      font-size: 25px;
      font-weight: 900;
      background:
        linear-gradient(
          145deg,
          #1266df,
          #092c77
        );
      box-shadow:
        0 15px 28px rgba(15, 80, 186, 0.25);
    }

    .brand-name {
      letter-spacing: 7px;
      font-size: 24px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
    }

    .intro {
      margin: 0 0 28px;
      color: #687996;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 1px solid #d9e2f1;
      border-radius: 15px;
      outline: none;
      color: #071c43;
      font: inherit;
      font-weight: 600;
      background: white;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #2865e8;
      box-shadow:
        0 0 0 4px rgba(40, 101, 232, 0.12);
    }

    .password-note {
      margin: 9px 0 0;
      color: #7a8aa4;
      font-size: 12px;
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      border: 0;
      border-radius: 15px;
      color: white;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      background:
        linear-gradient(
          100deg,
          #0756d9,
          #7035f4
        );
      box-shadow:
        0 16px 28px rgba(61, 72, 220, 0.24);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    .status {
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .status.hidden {
      display: none;
    }

    .status.error {
      color: #a61b2b;
      background: #fff0f2;
      border: 1px solid #ffd0d7;
    }

    .status.success {
      color: #087441;
      background: #eafbf3;
      border: 1px solid #bcebd2;
    }

    @media (max-width: 540px) {
      .setup-card {
        padding: 30px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="setup-card">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div class="brand-name">FORGE</div>
    </div>

    <h1>Welcome to FORGE</h1>

    <p class="intro">
      Create your password to activate your administrator
      account and enter your organization’s workspace.
    </p>

    <form id="passwordSetupForm">
      <label for="newPassword">
        Create Password
      </label>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Enter at least 8 characters"
      />

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Enter your password again"
      />

      <p class="password-note">
        Use at least eight characters.
      </p>

      <button
        id="activateAccountButton"
        type="submit"
      >
        Activate My Account
      </button>

      <div
        id="setupStatus"
        class="status hidden"
        role="status"
      ></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=2"></script>

  <script>
    const form =
      document.getElementById(
        "passwordSetupForm"
      );

    const passwordInput =
      document.getElementById(
        "newPassword"
      );

    const confirmInput =
      document.getElementById(
        "confirmPassword"
      );

    const button =
      document.getElementById(
        "activateAccountButton"
      );

    const statusBox =
      document.getElementById(
        "setupStatus"
      );


    function showStatus(
      message,
      type = "error"
    ) {
      statusBox.textContent = message;
      statusBox.className =
        `status ${type}`;
    }


    async function confirmInvitationSession() {
      const {
        data: { session },
        error
      } =
        await forgeSupabase.auth
          .getSession();

      if (error) {
        console.error(
          "FORGE INVITATION SESSION ERROR:",
          error
        );
      }

      if (!session) {
        showStatus(
          "This invitation link is invalid or has expired. Please request a new invitation."
        );

        button.disabled = true;

        return false;
      }

      return true;
    }


    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const password =
          passwordInput.value;

        const confirmation =
          confirmInput.value;

        if (password.length < 8) {
          showStatus(
            "Your password must contain at least eight characters."
          );

          return;
        }

        if (password !== confirmation) {
          showStatus(
            "The passwords do not match."
          );

          return;
        }

        button.disabled = true;
        button.textContent =
          "Activating Account...";

        try {
          const hasSession =
            await confirmInvitationSession();

          if (!hasSession) return;

          const {
            error
          } =
            await forgeSupabase.auth
              .updateUser({
                password
              });

          if (error) {
            throw error;
          }

          showStatus(
            "Your FORGE account is active. Opening your workspace...",
            "success"
          );

          button.textContent =
            "Account Activated";

          setTimeout(() => {
            window.location.replace(
              "./index.html"
            );
          }, 1400);

        } catch (error) {
          console.error(
            "FORGE PASSWORD SETUP ERROR:",
            error
          );

          showStatus(
            error?.message ||
              "FORGE could not activate your account."
          );

          button.disabled = false;
          button.textContent =
            "Activate My Account";
        }
      }
    );


    confirmInvitationSession();
  </script>
</body>
</html>
